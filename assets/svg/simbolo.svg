<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .cb-symbol { transform-origin: center; }
    </style>
  </defs>
  
    <g class="cb-symbol">
