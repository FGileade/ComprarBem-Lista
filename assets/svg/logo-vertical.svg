<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap');
      .font-brand { font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>
  <!-- Símbolo Centralizado -->
  <g transform="translate(120, 36) scale(0.88)">
    <rect width="180" height="180" rx="44" fill="#1F5A42" />
    <g transform="translate(15, 15) scale(0.75)">
      
    <g class="cb-symbol">
      <!-- Handle -->
      <path d="M 68 86 V 56 C 68 38, 132 38, 132 56 V 86" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="14" 
            stroke-linecap="round" />
      
      <!-- Leaf Accent on Shoulder -->
      <path d="M 132 56 C 138 38, 162 38, 162 58 C 162 74, 142 78, 132 56 Z" 
            fill="#E7A93B" />
      
      <!-- Basket / Bag Body -->
      <rect x="42" y="86" width="116" height="90" rx="26" ry="26" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="14" />
      
      <!-- Checklist / Checkmark -->
      <path d="M 74 130 L 92 148 L 126 110" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="14" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  
    </g>
  </g>
  <!-- Nome -->
  <g transform="translate(200, 268)">
    <text class="font-brand" text-anchor="middle" font-size="46" font-weight="700" fill="#20302A" letter-spacing="-0.5">Compra<tspan font-weight="900" fill="#2F7D5A">Bem</tspan></text>
  </g>
  <!-- Subtítulo / Badge -->
  <g transform="translate(155, 296)">
    <rect width="90" height="30" rx="8" fill="#DDF2E7" />
    <text class="font-brand" x="45" y="21" text-anchor="middle" font-size="16" font-weight="800" fill="#1F5A42">LISTA</text>
  </g>
  <!-- Slogan -->
  <g transform="translate(200, 368)">
    <text class="font-brand" text-anchor="middle" font-size="17" font-weight="600" fill="#667085">Sua orientação aplicada às compras.</text>
  </g>
